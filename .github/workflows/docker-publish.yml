name: Build and Publish Docker Image to GHCR

on:
  pull_request:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  # 支持在 GitHub 页面上随时点击按钮手动触发构建
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名称会统一转为小写。
  IMAGE_NAME_GO: ${{ github.repository }}
  IMAGE_NAME_ROUTER: ${{ github.repository_owner }}/9router-litestream

jobs:
  validate:
    name: Validate entrypoint and Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: sh -n entrypoint.sh tests/entrypoint_test.sh tests/config_test.sh tests/container_smoke_test.sh

      - name: Run configuration consistency tests
        run: sh tests/config_test.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck entrypoint.sh tests/entrypoint_test.sh tests/config_test.sh tests/container_smoke_test.sh

      - name: Run entrypoint behavior tests
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" alpine:3.20 sh /work/tests/entrypoint_test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build 9router-go image for validation
        run: docker buildx build --platform linux/amd64 --file ./Dockerfile --tag 9router-go-litestream:ci --load .

      - name: Build 9router image for validation
        run: docker buildx build --platform linux/amd64 --file ./Dockerfile.9router --tag 9router-litestream:ci --load .

      - name: Smoke test 9router-go container
        run: sh tests/container_smoke_test.sh 9router-go-litestream:ci 20130

      - name: Smoke test 9router container
        run: sh tests/container_smoke_test.sh 9router-litestream:ci 20128

  build-and-push:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 设置 QEMU 模拟器，支持跨架构编译（amd64 和 arm64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # 设置 Docker Buildx 构建器
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 登录到 GitHub Container Registry (GHCR)
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 提取两个 profile 的元数据（用于生成标签与版本号）
      - name: Extract 9router-go metadata
        id: meta-go
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GO }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Extract 9router metadata
        id: meta-router
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ROUTER }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # 构建并推送两个 GHCR 镜像（同时支持 linux/amd64 与 linux/arm64）
      - name: Build and push 9router-go image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-go.outputs.tags }}
          labels: ${{ steps.meta-go.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push 9router image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.9router
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-router.outputs.tags }}
          labels: ${{ steps.meta-router.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
